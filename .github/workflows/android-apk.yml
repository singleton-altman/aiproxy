name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      EXPO_NO_TELEMETRY: 1
      NODE_ENV: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Read app version
        id: app_version
        run: |
          APP_VERSION="$(node -p "require('./app.json').expo.version")"
          echo "APP_VERSION=${APP_VERSION}" >> "$GITHUB_ENV"
          echo "version=${APP_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo rm -rf "$ANDROID_SDK_ROOT/ndk"
          sudo mkdir -p "$ANDROID_SDK_ROOT/ndk"
          sudo chown -R "$USER:$USER" "$ANDROID_SDK_ROOT/ndk"
          df -h /

      - name: Install dependencies
        run: npm ci

      - name: Verify endpoint coverage, types, and dependencies
        run: npm run verify

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean

      - name: Configure Gradle memory
        run: |
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -XX:ReservedCodeCacheSize=512m/' android/gradle.properties
          sed -i 's/^org.gradle.parallel=.*/org.gradle.parallel=false/' android/gradle.properties
          sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=armeabi-v7a,arm64-v8a/' android/gradle.properties
          printf '\norg.gradle.workers.max=1\n' >> android/gradle.properties
          df -h /

      - name: Build release APK
        working-directory: android
        run: |
          set -o pipefail
          chmod +x gradlew
          mkdir -p ../artifacts/diagnostics
          LOG_FILE="../artifacts/diagnostics/android-gradle.log"
          if ./gradlew assembleRelease --no-daemon --stacktrace --max-workers=1 2>&1 | tee "$LOG_FILE"; then
            df -h /
            exit 0
          fi

          echo "Initial Gradle build failed; stopping workers and retrying once." | tee -a "$LOG_FILE"
          ./gradlew --stop || true
          sleep 10
          ./gradlew assembleRelease --no-daemon --stacktrace --max-workers=1 2>&1 | tee -a "$LOG_FILE"
          df -h /

      - name: Collect APK
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk "artifacts/AI-Proxy-${APP_VERSION}.apk"
          file "artifacts/AI-Proxy-${APP_VERSION}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI Proxy Android ${{ steps.app_version.outputs.version }}
          path: "artifacts/AI-Proxy-${{ steps.app_version.outputs.version }}.apk"
          if-no-files-found: error

      - name: Upload Android diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: AI Proxy Android diagnostics ${{ steps.app_version.outputs.version }}
          path: artifacts/diagnostics
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish build summary
        if: always()
        run: |
          {
            echo "## Android APK Build"
            echo ""
            echo "- App version: ${APP_VERSION}"
            echo "- Build type: release APK signed with the generated debug key"
            echo "- GitHub artifact: AI Proxy Android ${APP_VERSION}"
            echo "- File: AI-Proxy-${APP_VERSION}.apk"
            if [[ -f artifacts/diagnostics/android-gradle.log ]]; then
              echo ""
              echo "<details><summary>Gradle log tail</summary>"
              echo ""
              echo '```text'
              tail -n 160 artifacts/diagnostics/android-gradle.log
              echo '```'
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
